name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-test:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Offline handshake and privacy tests
        run: |
          go run ./cmd/support privacy
      - name: Format and vet
        run: |
          test -z "$(gofmt -l $(find . -name '*.go'))"
          go vet ./...
      - name: Test with race and coverage
        run: |
          set -o pipefail
          go test -race -json -coverprofile=coverage.out ./... | tee test-events.json
      - name: Coverage total
        if: always()
        run: go tool cover -func=coverage.out | tail -1 > coverage-total.txt
      - name: Coverage floor
        if: always()
        run: |
          # Ratchet: total ./... statements >= 70.0 (measured 70.1% at 28d1b5f;
          # restore to >= 80 once tools/buildman and internal/clispec are tested).
          # Production root package >= 80 (measured 86.3% at 28d1b5f).
          # Metric is statement coverage; go tool cover has no branch metric.
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "Total statement coverage (all packages): ${total}% (floor 70)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v f=70 'BEGIN { exit !(t+0 >= f+0 && t != "") }'
          go test -covermode=atomic -coverprofile=cover-root.out . >/dev/null
          root=$(go tool cover -func=cover-root.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "Root package statement coverage: ${root}% (floor 80)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$root" -v f=80 'BEGIN { exit !(t+0 >= f+0 && t != "") }'
      - name: Build
        run: go build -trimpath -o /tmp/coverage-audit .
      - name: Summary
        if: always()
        run: go run ./cmd/support summary
      - name: Publish measured main-only badges
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          go run ./cmd/support badges
          bash scripts/push_badges.sh /tmp/badges
