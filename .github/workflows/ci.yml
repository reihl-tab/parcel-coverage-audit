name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-test:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Offline handshake and privacy tests
        run: |
          go run ./cmd/support privacy
      - name: Format and vet
        run: |
          test -z "$(gofmt -l $(find . -name '*.go'))"
          go vet ./...
      - name: Test with race and coverage
        run: |
          set -o pipefail
          go test -race -json -coverprofile=coverage.out ./... | tee test-events.json
      - name: Coverage total
        if: always()
        run: go tool cover -func=coverage.out | tail -1 > coverage-total.txt
      - name: Build
        run: go build -trimpath -o /tmp/coverage-audit .
      - name: Summary
        if: always()
        run: go run ./cmd/support summary
      - name: Publish measured main-only badges
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          go run ./cmd/support badges
          bash scripts/push_badges.sh /tmp/badges
